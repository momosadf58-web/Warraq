<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Warraq</title>
<style>
@font-face{font-family:Warraq;src:url('aref.ttf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#29231c;color:#fff4dc;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block}button,select{font:inherit;color:inherit;background:#211d17e8;border:1px solid #c3a77570;border-radius:12px;padding:10px}button:active{background:#725d3c}#hud{position:fixed;inset:0;pointer-events:none}canvas{position:fixed;inset:0}#bar{display:flex;align-items:center;gap:8px;margin:12px;pointer-events:auto}#name{font:25px Warraq,serif;flex:1;text-align:center}#filters{display:flex;gap:6px;margin:8px 12px;pointer-events:auto;overflow:auto}select{font-size:12px;max-width:38%;min-height:42px}#progress{margin:8px 12px;background:#211d17de;padding:8px 12px;border-radius:10px;width:fit-content;font-size:12px}#hint{position:absolute;bottom:16px;left:140px;right:12px;font-size:12px;line-height:1.5;text-align:center;color:#f3e4c5;text-shadow:0 2px 3px #000}#pad{pointer-events:auto;position:absolute;bottom:24px;left:20px;width:104px;height:104px;border:1px solid #e8d1a670;border-radius:50%;background:#241f1870}#stick{position:absolute;left:35px;top:35px;width:32px;height:32px;border-radius:50%;background:#dfc696aa;border:1px solid #fff4dc}#books{position:absolute;top:118px;right:12px;max-height:55%;width:min(300px,80%);overflow:auto;background:#211d17f5;border:1px solid #ae946b;border-radius:12px;padding:12px;pointer-events:auto}#books button{display:block;width:100%;margin:6px 0;text-align:start}#loading{position:absolute;inset:45% 5% auto;text-align:center;color:#eee4ce;font-size:14px;pointer-events:none}
</style></head><body><div id="loading">Warraq</div><div id="hud"><div id="bar"><button id="back">‹</button><span id="name">الورّاق</span><button id="home">⌂</button><button id="list">☷</button></div><div id="filters"><select id="genre"></select><select id="year"></select><select id="kind"></select></div><div id="progress"></div><div id="books" hidden></div><div id="pad"><div id="stick"></div></div><div id="hint"></div></div><script type="module" src="room.js"></script></body></html>
